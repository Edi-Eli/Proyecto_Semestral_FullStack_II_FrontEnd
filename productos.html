<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/producto.css">
</head>
<body>
    <nav-no></nav-no>
    <script src="componet/Header.js"></script>

    <main>
        <h2 class="ti-pro">Nuestros Productos</h2>
        <section class="seccion-pro">
            <div class="conte-tar-pro" id="contenedor-productos"></div>
        </section>
    </main>

    <flo-to></flo-to>
    <script src="componet/Flooter.js"></script>
    <script src="js/main.js"></script>
    <script src="js/producto.js"></script>

    <script>
        const contenedor = document.getElementById("contenedor-productos");

        PRODUCTOS.forEach(p => {
            const imagen = p.imagen || "assets/imagenes/image.png";

            contenedor.innerHTML += `
                <article class="tarjeta-pro">
                    <img src="${imagen}" alt="${p.nombre}">
                    <h3>${p.nombre}</h3>
                    <p class="precio">$${p.precio.toLocaleString("es-CL")}</p>
                    <div class="acciones">
                        <button class="btn-pro2" onclick="agregarAlCarrito('${p.nombre}',${p.precio},'${imagen}')">Agregar al Carro</button>
                        <button class="btn-pro2" onclick="window.location.href='detalle-producto.html?id=${p.id}'">Detalle Producto</button>
                    </div>
                </article>
            `;
        }); 
    </script>
</body>
</html>
