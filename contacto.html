<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav-no></nav-no>
    <script src="componet/Header.js"></script>

    <main>
        <h2 class="titulo-pagina">Contáctanos</h2>

        <div class="contacto-info">
            <p>
                ¿Tienes dudas sobre nuestros productos, cotizaciones o despachos?
                Escríbenos y te responderemos a la brevedad.
            </p>
        </div>

        <form id="form-contacto" class="contacto-card" novalidate>

            <div class="form-group">
                <label class="form-label" for="nombre-contacto">Nombre <span class="obligatorio">*</span></label>
                <input type="text" id="nombre-contacto" class="form-control" placeholder="Ej: María González" maxlength="100">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label class="form-label" for="correo-contacto">Correo <span class="obligatorio">*</span></label>
                <input type="email" id="correo-contacto" class="form-control" placeholder="Ej: nombre@duoc.cl" maxlength="100">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label class="form-label" for="comentario">Comentario <span class="obligatorio">*</span></label>
                <textarea id="comentario" class="form-control" rows="5" placeholder="Escribe tu mensaje..." maxlength="500"></textarea>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-form">Enviar mensaje</button>
            </div>
        </form>
    </main>

    <flo-to></flo-to>
    <script src="componet/Flooter.js"></script>
    <script src="js/validaciones.js"></script>
    <script>
        const formContacto = document.getElementById("form-contacto");

        function validarNombre() {
            const nombre = document.getElementById("nombre-contacto").value;
            if (!requerido(nombre)) {
                agregarError("nombre-contacto", "El nombre es requerido.");
                return false;
            }
            if (!maxCaracteres(nombre, 100)) {
                agregarError("nombre-contacto", "El nombre no puede superar los 100 caracteres.");
                return false;
            }
            limpiarError("nombre-contacto");
            return true;
        }

        function validarCorreo() {
            const correo = document.getElementById("correo-contacto").value;
            if (!requerido(correo)) {
                agregarError("correo-contacto", "El correo es requerido.");
                return false;
            }
            if (!maxCaracteres(correo, 100)) {
                agregarError("correo-contacto", "El correo no puede superar los 100 caracteres.");
                return false;
            }
            if (!esCorreoValido(correo)) {
                agregarError("correo-contacto", "Usa un correo con dominio @duoc.cl, @profesor.duoc.cl o @gmail.com.");
                return false;
            }
            limpiarError("correo-contacto");
            return true;
        }

        function validarComentario() {
            const comentario = document.getElementById("comentario").value;
            if (!requerido(comentario)) {
                agregarError("comentario", "El comentario es requerido.");
                return false;
            }
            if (!maxCaracteres(comentario, 500)) {
                agregarError("comentario", "El comentario no puede superar los 500 caracteres.");
                return false;
            }
            limpiarError("comentario");
            return true;
        }

        document.getElementById("nombre-contacto").addEventListener("input", validarNombre);
        document.getElementById("correo-contacto").addEventListener("input", validarCorreo);
        document.getElementById("comentario").addEventListener("input", validarComentario);

        formContacto.addEventListener("submit", (evento) => {
            evento.preventDefault();

            if (validarNombre() & validarCorreo() & validarComentario()) {
                alert("¡Mensaje enviado! Te responderemos pronto.");
                formContacto.reset();
            } else {
                alert("Revisa los campos marcados en rojo.");
            }
        });
    </script>
</body>
</html>
